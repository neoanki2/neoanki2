name: Test

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-plan:
    name: Validate UI investigation plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate retained UI investigation scripts
        run: |
          bash -n Scripts/ci-ui-test-plan.sh Scripts/build-macos-ui-tests.sh \
            Scripts/run-ui-tests.sh Scripts/run-ios-ui-tests.sh
          python3 Scripts/test-ios-ui-runner.py
          python3 Scripts/test-ios-ui-retry.py
          python3 Scripts/test-ios-runtime-selection.py
          python3 Scripts/test-ios-test-services.py
          bash Scripts/ci-ui-test-plan.sh macos >/dev/null
          bash Scripts/ci-ui-test-plan.sh ios >/dev/null

  swift-tests:
    name: Swift unit + flow + architecture tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Ensure the architecture scanner is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version
      - name: Run every SwiftPM test gate with shared build products
        run: |
          failures=0
          bash -n Scripts/release.sh Scripts/release-fast.sh Scripts/build-release-candidate.sh \
            Scripts/publish-release-candidate.sh \
            Scripts/reconcile-release-workflows.sh Scripts/ship-release.sh \
            Scripts/test-release-workflow-reconciliation.sh \
            Scripts/watch-release-workflow.sh \
            Scripts/ci-ui-test-plan.sh Scripts/build-macos-ui-tests.sh \
            Scripts/run-ui-tests.sh Scripts/run-ios-ui-tests.sh || failures=1
          python3 Scripts/test-release.py || failures=1
          python3 Scripts/test-deploy-iphone.py || failures=1
          python3 Scripts/test-release-ios.py || failures=1
          python3 Scripts/test-release-macos-app-store.py || failures=1
          python3 Scripts/test-macos-testflight.py || failures=1
          python3 Scripts/test-review-macos-app.py || failures=1
          bash Scripts/test-release-workflow-reconciliation.sh || failures=1
          python3 Scripts/test-validate-architecture.py || failures=1
          bash Scripts/validate-architecture.sh || failures=1
          (cd NeoAnkiCore && swift test --parallel) || failures=1
          swift test --parallel || failures=1
          bash Scripts/validate-xcode-build-paths.sh || failures=1
          exit "$failures"

  shared-platforms:
    name: Shared targets (macOS + iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build every shared scheme on both platforms
        run: |
          failures=0
          for platform in macOS 'iOS Simulator'; do
            destination="generic/platform=$platform"
            for scheme in NeoAnkiApplication NeoAnkiFeatures NeoAnkiSharedUI NeoAnkiCloudSync NeoAnkiDeckBuilderCore NeoAnkiMobile; do
              xcodebuild build \
                -scheme "$scheme" \
                -destination "$destination" \
                CODE_SIGNING_ALLOWED=NO || failures=1
            done
            (
              cd NeoAnkiCore
              xcodebuild build \
                -scheme NeoAnkiCore \
                -destination "$destination" \
                CODE_SIGNING_ALLOWED=NO
            ) || failures=1
          done
          exit "$failures"

  ios-build:
    name: iPhone/iPad app + widget + archive
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build app and embedded widgets
        run: |
          chmod +x Scripts/build-ios.sh
          ./Scripts/build-ios.sh
      - name: Validate unsigned Release archive
        run: |
          xcodebuild archive \
            -project Xcode/NeoAnkiiOS.xcodeproj \
            -scheme NeoAnkiiOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/.build/NeoAnki2-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            "SWIFT_INCLUDE_PATHS=$PWD/build/Release-iphoneos $PWD/NeoAnkiCore/build/Release-iphoneos"
          test -x .build/NeoAnki2-unsigned.xcarchive/Products/Applications/NeoAnki2.app/NeoAnki2
          test -x .build/NeoAnki2-unsigned.xcarchive/Products/Applications/NeoAnki2.app/PlugIns/NeoAnki2Widget.appex/NeoAnki2Widget

  # Hosted XCTest UI runs have failed across unrelated journeys in screenshot,
  # orientation, Accessibility, and launch IPC. Keep these investigations in the
  # CLI runners; automatic CI gates headless behavior and real platform builds.
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - swift-tests
      - shared-platforms
      - ios-build
      - test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test and build job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .["swift-tests"].result == "success" and
            .["shared-platforms"].result == "success" and
            .["ios-build"].result == "success" and
            .["test-plan"].result == "success"
          ' >/dev/null
