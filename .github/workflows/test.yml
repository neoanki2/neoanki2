name: Test

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-plan:
    name: Validate required UI coverage plan
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.matrix.outputs.macos }}
      ios: ${{ steps.matrix.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: matrix
        name: Publish checked UI shards
        run: |
          bash -n Scripts/ci-ui-test-plan.sh Scripts/build-macos-ui-tests.sh \
            Scripts/run-ui-tests.sh Scripts/run-ios-ui-tests.sh
          echo "macos=$(bash Scripts/ci-ui-test-plan.sh macos)" >> "$GITHUB_OUTPUT"
          echo "ios=$(bash Scripts/ci-ui-test-plan.sh ios)" >> "$GITHUB_OUTPUT"

  swift-tests:
    name: Swift unit + flow + architecture tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run every SwiftPM test gate with shared build products
        run: |
          failures=0
          bash -n Scripts/release.sh Scripts/build-release-candidate.sh \
            Scripts/publish-release-candidate.sh \
            Scripts/reconcile-release-workflows.sh Scripts/ship-release.sh \
            Scripts/test-release-workflow-reconciliation.sh \
            Scripts/watch-release-workflow.sh \
            Scripts/ci-ui-test-plan.sh Scripts/build-macos-ui-tests.sh \
            Scripts/run-ui-tests.sh Scripts/run-ios-ui-tests.sh || failures=1
          bash Scripts/test-release-workflow-reconciliation.sh || failures=1
          bash Scripts/validate-architecture.sh || failures=1
          (cd NeoAnkiCore && swift test --parallel) || failures=1
          swift test --filter NeoAnki2Tests --parallel || failures=1
          bash Scripts/validate-xcode-build-paths.sh || failures=1
          swift test --filter NeoAnkiApplicationTests --parallel || failures=1
          swift test --filter NeoAnkiFeaturesTests --parallel || failures=1
          exit "$failures"

  shared-platforms:
    name: Shared targets (macOS + iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build every shared scheme on both platforms
        run: |
          failures=0
          for platform in macOS 'iOS Simulator'; do
            destination="generic/platform=$platform"
            for scheme in NeoAnkiApplication NeoAnkiFeatures NeoAnkiSharedUI NeoAnkiCloudSync NeoAnkiDeckBuilderCore NeoAnkiMobile; do
              xcodebuild build \
                -scheme "$scheme" \
                -destination "$destination" \
                CODE_SIGNING_ALLOWED=NO || failures=1
            done
            (
              cd NeoAnkiCore
              xcodebuild build \
                -scheme NeoAnkiCore \
                -destination "$destination" \
                CODE_SIGNING_ALLOWED=NO
            ) || failures=1
          done
          exit "$failures"

  ios-build:
    name: iPhone/iPad app + widget + archive
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build app and embedded widgets
        run: |
          chmod +x Scripts/build-ios.sh
          ./Scripts/build-ios.sh
      - name: Validate unsigned Release archive
        run: |
          xcodebuild archive \
            -project Xcode/NeoAnkiiOS.xcodeproj \
            -scheme NeoAnkiiOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/.build/NeoAnki2-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            "SWIFT_INCLUDE_PATHS=$PWD/build/Release-iphoneos $PWD/NeoAnkiCore/build/Release-iphoneos"
          test -x .build/NeoAnki2-unsigned.xcarchive/Products/Applications/NeoAnki2.app/NeoAnki2
          test -x .build/NeoAnki2-unsigned.xcarchive/Products/Applications/NeoAnki2.app/PlugIns/NeoAnki2Widget.appex/NeoAnki2Widget

  ios-ui-build:
    name: Build iOS UI test bundle
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build once for all simulator destinations
        run: bash Scripts/build-ios-ui-tests.sh
      - name: Upload exact-revision UI build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-ui-build-${{ github.sha }}
          path: .build/ios-ui-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  ios-ui:
    name: iOS UI (${{ matrix.id }} · ${{ matrix.device }})
    needs: [test-plan, ios-ui-build]
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.ios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download exact-revision UI build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ios-ui-build-${{ github.sha }}
          path: .build/ios-ui-artifact
      - name: Run mobile UI journeys
        env:
          DEVICE: ${{ matrix.device }}
          NEOANKI_IOS_UI_SHARD: ${{ matrix.id }}
          NEOANKI_IOS_UI_ONLY_TESTING: ${{ matrix.tests }}
          NEOANKI_IOS_UI_PARALLEL_WORKERS: ${{ matrix.workers }}
        run: bash Scripts/run-ios-ui-tests.sh
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-ui-${{ matrix.id }}
          path: .build/ios-ui-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  macos-ui-build:
    name: Build macOS UI test bundle
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build once for all functional shards
        run: bash Scripts/build-macos-ui-tests.sh
      - name: Upload exact-revision UI build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-ui-build-${{ github.sha }}
          path: .build/macos-ui-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  macos-ui:
    name: macOS UI (${{ matrix.id }})
    needs: [test-plan, macos-ui-build]
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.macos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download exact-revision UI build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-ui-build-${{ github.sha }}
          path: .build/macos-ui-artifact
      - name: Run functional UI shard
        env:
          NEOANKI_UI_SHARD: ${{ matrix.id }}
          NEOANKI_UI_ONLY_TESTING: ${{ matrix.tests }}
          NEOANKI_UI_REUSE_BUILD: 1
        run: bash Scripts/run-ui-tests.sh
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-ui-${{ matrix.id }}
          path: .build/ui-results
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - swift-tests
      - shared-platforms
      - ios-build
      - test-plan
      - ios-ui-build
      - ios-ui
      - macos-ui-build
      - macos-ui
    runs-on: ubuntu-latest
    steps:
      - name: Require every test and build job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .["swift-tests"].result == "success" and
            .["shared-platforms"].result == "success" and
            .["ios-build"].result == "success" and
            .["test-plan"].result == "success" and
            .["ios-ui-build"].result == "success" and
            .["ios-ui"].result == "success" and
            .["macos-ui-build"].result == "success" and
            .["macos-ui"].result == "success"
          ' >/dev/null
