name: Test

permissions:
  contents: read

on:
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-unit:
    name: Unit tests (${{ matrix.package }})
    runs-on: ${{ matrix.runner }}
    # Keep the cold-build budget when the app lane first populates its arm64 cache.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # App compilation and tests are the longest path to CI Gate.
          - package: app
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.2.app/Contents/Developer
          - package: core
            runner: macos-26-intel
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      UNIT_PACKAGE: ${{ matrix.package }}
      UNIT_SCRATCH_PATH: ${{ github.workspace }}/.build/ci-unit-${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Identify compiler, SDK and workspace for compiled-test cache
        id: toolchain
        # Reads version files only; launching xcodebuild hung a runner for 20 minutes.
        timeout-minutes: 2
        env:
          UNIT_MANIFESTS: ${{ matrix.package == 'app' && hashFiles('Package.swift', 'NeoAnkiCore/Package.swift', '**/Package.resolved') || hashFiles('NeoAnkiCore/Package.swift', 'NeoAnkiCore/Package.resolved') }}
          UNIT_RUNNER: ${{ hashFiles('Scripts/test-unit.sh') }}
        run: |
          sdk="$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          xcode_build=$(plutil -extract ProductBuildVersion raw "$DEVELOPER_DIR/../version.plist")
          if [[ "$UNIT_PACKAGE" == app && "$xcode_build" != "$(cat Config/app-unit-xcode-build.txt)" ]]; then
            echo "App CI Xcode build $xcode_build does not match Config/app-unit-xcode-build.txt." >&2
            exit 1
          fi
          {
            # The Xcode build pins its bundled Swift toolchain.
            plutil -extract CFBundleShortVersionString raw "$DEVELOPER_DIR/../version.plist"
            printf '%s\n' "$xcode_build"
            plutil -extract Version raw "$sdk/SDKSettings.plist"
            plutil -extract ProductBuildVersion raw "$sdk/System/Library/CoreServices/SystemVersion.plist"
            printf '%s\n' "$DEVELOPER_DIR" "$GITHUB_WORKSPACE" "$UNIT_MANIFESTS" "$UNIT_RUNNER"
          } > "$RUNNER_TEMP/unit-toolchain.txt"
          digest=$(shasum -a 256 "$RUNNER_TEMP/unit-toolchain.txt" | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore compiled unit tests
        id: build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UNIT_SCRATCH_PATH }}
          key: unit-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ steps.toolchain.outputs.digest }}-${{ matrix.package == 'app' && hashFiles('Sources/**', 'Tests/**', 'Tools/**', 'NeoAnkiCore/Sources/**') || hashFiles('NeoAnkiCore/Sources/**', 'NeoAnkiCore/Tests/**') }}
          restore-keys: |
            unit-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ steps.toolchain.outputs.digest }}-
      # Only an exact source/toolchain match can skip compilation. Every run
      # executes tests; an incremental cache restore still rebuilds first.
      - name: Run unit tests
        env:
          UNIT_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: |
          if [[ "$UNIT_CACHE_HIT" == true ]]; then
            ./Scripts/test-unit.sh "$UNIT_PACKAGE" --skip-build
          else
            ./Scripts/test-unit.sh "$UNIT_PACKAGE"
          fi

  tooling-unit:
    name: Tooling unit tests
    runs-on: macos-26-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the architecture scan dependency
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version
      - name: Run isolated tooling unit tests
        run: ./Scripts/test-unit.sh tooling

  chrome-unit:
    name: Chrome companion unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./Scripts/test-unit.sh chrome

  ci-gate:
    name: CI Gate
    if: always()
    needs: [swift-unit, tooling-unit, chrome-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require all unit-test jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .["swift-unit"].result == "success" and
            .["tooling-unit"].result == "success" and
            .["chrome-unit"].result == "success"
          ' >/dev/null
      - name: Record the Git tree tested by all unit jobs
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: git rev-parse 'HEAD^{tree}' > tested-tree.txt
      - name: Retain test evidence for release
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unit-tested-tree-${{ github.run_attempt }}
          path: tested-tree.txt
          if-no-files-found: error
