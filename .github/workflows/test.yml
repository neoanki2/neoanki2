name: Test

permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-fast:
    name: Core unit + flow tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run NeoAnkiCore tests
        run: |
          cd NeoAnkiCore
          swift test --parallel

  app-models:
    name: App ViewModel tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run NeoAnki2Tests
        run: swift test --filter NeoAnki2Tests --parallel

  ui-smoke:
    name: Fast functional UI journeys
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build app bundle and run UI tests
        run: |
          chmod +x Scripts/build-test-app.sh Scripts/run-ui-tests.sh
          ./Scripts/run-ui-tests.sh
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neoanki2-fast-ui-results
          path: .build/ui-results
          if-no-files-found: warn
          retention-days: 7
