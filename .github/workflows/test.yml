name: Test

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-fast:
    name: Core unit + flow + architecture tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate module boundaries
        run: bash Scripts/validate-architecture.sh
      - name: Run NeoAnkiCore tests
        run: |
          cd NeoAnkiCore
          swift test --parallel

  app-models:
    name: App ViewModel tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run NeoAnki2Tests
        run: swift test --filter NeoAnki2Tests --parallel
      - name: Verify Xcode build products stay out of Spotlight
        run: bash Scripts/validate-xcode-build-paths.sh

  shared-platforms:
    name: Shared targets (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS Simulator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build shared package schemes
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          destination="generic/platform=$PLATFORM"
          for scheme in NeoAnkiApplication NeoAnkiFeatures NeoAnkiSharedUI NeoAnkiCloudSync NeoAnkiDeckBuilderCore NeoAnkiMobile; do
            xcodebuild build \
              -scheme "$scheme" \
              -destination "$destination" \
              CODE_SIGNING_ALLOWED=NO
          done
      - name: Build Core for the same platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd NeoAnkiCore
          xcodebuild build \
            -scheme NeoAnkiCore \
            -destination "generic/platform=$PLATFORM" \
            CODE_SIGNING_ALLOWED=NO

  application-tests:
    name: Application and sync policy tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: swift test --filter NeoAnkiApplicationTests --parallel

  ios-build:
    name: iPhone/iPad app + widget + archive
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run shared mobile feature tests
        run: swift test --filter NeoAnkiFeaturesTests --parallel
      - name: Build app and embedded widgets
        run: |
          chmod +x Scripts/build-ios.sh
          ./Scripts/build-ios.sh
      - name: Validate unsigned Release archive
        run: |
          xcodebuild archive \
            -project Xcode/NeoAnkiiOS.xcodeproj \
            -scheme NeoAnkiiOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/.build/NeoAnki2-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            "SWIFT_INCLUDE_PATHS=$PWD/build/Release-iphoneos $PWD/NeoAnkiCore/build/Release-iphoneos"
          test -x .build/NeoAnki2-unsigned.xcarchive/Products/Applications/NeoAnki2.app/NeoAnki2
          test -x .build/NeoAnki2-unsigned.xcarchive/Products/Applications/NeoAnki2.app/PlugIns/NeoAnki2Widget.appex/NeoAnki2Widget

  ios-ui-build:
    name: Build iOS UI test bundle
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build once for all simulator destinations
        run: bash Scripts/build-ios-ui-tests.sh
      - name: Upload exact-revision UI build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-ui-build-${{ github.sha }}
          path: .build/ios-ui-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  ios-ui:
    name: iOS UI + accessibility (${{ matrix.device }})
    needs: ios-ui-build
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone 17e, iPhone 17 Pro Max, iPad Pro 13-inch (M5)]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download exact-revision UI build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ios-ui-build-${{ github.sha }}
          path: .build/ios-ui-artifact
      - name: Run mobile UI journeys
        env:
          DEVICE: ${{ matrix.device }}
        run: bash Scripts/run-ios-ui-tests.sh
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-ui-${{ matrix.device }}
          path: .build/ios-ui-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ui-smoke:
    name: Fast functional UI journeys
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build app bundle and run UI tests
        run: |
          chmod +x Scripts/build-test-app.sh Scripts/run-ui-tests.sh
          ./Scripts/run-ui-tests.sh
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neoanki2-fast-ui-results
          path: .build/ui-results
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - core-fast
      - app-models
      - shared-platforms
      - application-tests
      - ios-build
      - ios-ui-build
      - ios-ui
      - ui-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every test and build job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            exit 0
          fi
          echo "One or more required CI jobs did not succeed." >&2
          exit 1
