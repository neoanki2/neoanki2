name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-unit:
    name: Unit tests (${{ matrix.package }})
    runs-on: macos-26-intel
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [app, core]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIT_PACKAGE: ${{ matrix.package }}
      UNIT_SCRATCH_PATH: ${{ github.workspace }}/.build/ci-unit-${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Identify compiler, SDK and workspace for compiled-test cache
        id: toolchain
        env:
          UNIT_MANIFESTS: ${{ matrix.package == 'app' && hashFiles('Package.swift', 'NeoAnkiCore/Package.swift', '**/Package.resolved') || hashFiles('NeoAnkiCore/Package.swift', 'NeoAnkiCore/Package.resolved') }}
          UNIT_RUNNER: ${{ hashFiles('Scripts/test-unit.sh') }}
        run: |
          {
            xcodebuild -version
            swift --version
            xcrun --sdk macosx --show-sdk-build-version
            printf '%s\n' "$DEVELOPER_DIR" "$GITHUB_WORKSPACE" "$UNIT_MANIFESTS" "$UNIT_RUNNER"
          } > "$RUNNER_TEMP/unit-toolchain.txt"
          digest=$(shasum -a 256 "$RUNNER_TEMP/unit-toolchain.txt" | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore compiled unit tests
        id: build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UNIT_SCRATCH_PATH }}
          key: unit-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ steps.toolchain.outputs.digest }}-${{ matrix.package == 'app' && hashFiles('Sources/**', 'Tests/**', 'Tools/**', 'NeoAnkiCore/Sources/**') || hashFiles('NeoAnkiCore/Sources/**', 'NeoAnkiCore/Tests/**') }}
          restore-keys: |
            unit-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ steps.toolchain.outputs.digest }}-
      # Only an exact source/toolchain match can skip compilation. Every run
      # executes tests; an incremental cache restore still rebuilds first.
      - name: Run unit tests
        env:
          UNIT_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: |
          if [[ "$UNIT_CACHE_HIT" == true ]]; then
            ./Scripts/test-unit.sh "$UNIT_PACKAGE" --skip-build
          else
            ./Scripts/test-unit.sh "$UNIT_PACKAGE"
          fi

  tooling-unit:
    name: Tooling unit tests
    runs-on: macos-26-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the architecture scan dependency
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version
      - name: Run isolated tooling unit tests
        run: ./Scripts/test-unit.sh tooling

  chrome-unit:
    name: Chrome companion unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./Scripts/test-unit.sh chrome

  ci-gate:
    name: CI Gate
    if: always()
    needs: [swift-unit, tooling-unit, chrome-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all unit-test jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .["swift-unit"].result == "success" and
            .["tooling-unit"].result == "success" and
            .["chrome-unit"].result == "success"
          ' >/dev/null
