name: Test

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-fast:
    name: Core unit + flow tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run NeoAnkiCore tests
        run: |
          cd NeoAnkiCore
          swift test --parallel

  app-models:
    name: App ViewModel tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run NeoAnki2Tests
        run: swift test --filter NeoAnki2Tests --parallel
      - name: Verify Xcode build products stay out of Spotlight
        run: bash Scripts/validate-xcode-build-paths.sh

  shared-platforms:
    name: Shared targets (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS Simulator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate module boundaries
        run: bash Scripts/validate-architecture.sh
      - name: Build shared package schemes
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          destination="generic/platform=$PLATFORM"
          for scheme in NeoAnkiApplication NeoAnkiFeatures NeoAnkiSharedUI NeoAnkiCloudSync NeoAnkiDeckBuilderCore NeoAnkiMobile; do
            xcodebuild build \
              -scheme "$scheme" \
              -destination "$destination" \
              CODE_SIGNING_ALLOWED=NO
          done
      - name: Build Core for the same platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd NeoAnkiCore
          xcodebuild build \
            -scheme NeoAnkiCore \
            -destination "generic/platform=$PLATFORM" \
            CODE_SIGNING_ALLOWED=NO

  application-tests:
    name: Application and sync policy tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: swift test --filter NeoAnkiApplicationTests --parallel

  ios-build:
    name: iPhone/iPad app + widget + archive
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run shared mobile feature tests
        run: swift test --filter NeoAnkiFeaturesTests --parallel
      - name: Build app and embedded widgets
        run: |
          chmod +x Scripts/build-ios.sh
          ./Scripts/build-ios.sh
      - name: Validate unsigned Release archive
        run: |
          xcodebuild archive \
            -project Xcode/NeoAnkiiOS.xcodeproj \
            -scheme NeoAnkiiOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/.build/NeoAnki2-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            "SWIFT_INCLUDE_PATHS=$PWD/build/Release-iphoneos $PWD/NeoAnkiCore/build/Release-iphoneos"
          test -x .build/NeoAnki2-unsigned.xcarchive/Products/Applications/NeoAnki2.app/NeoAnki2
          test -x .build/NeoAnki2-unsigned.xcarchive/Products/Applications/NeoAnki2.app/PlugIns/NeoAnki2Widget.appex/NeoAnki2Widget

  ios-ui:
    name: iOS UI + accessibility (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone SE (3rd generation), iPhone 17 Pro Max, iPad Pro 13-inch (M5)]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run mobile UI journeys
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          xcodebuild test \
            -project Xcode/NeoAnkiiOS.xcodeproj \
            -scheme NeoAnki2MobileUITests \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath ".build/ios-ui-$DEVICE.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            "SWIFT_INCLUDE_PATHS=$PWD/build/Debug-iphonesimulator $PWD/NeoAnkiCore/build/Debug-iphonesimulator"
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ui-${{ matrix.device }}
          path: .build/*.xcresult
          if-no-files-found: warn
          retention-days: 7

  ui-smoke:
    name: Fast functional UI journeys
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build app bundle and run UI tests
        run: |
          chmod +x Scripts/build-test-app.sh Scripts/run-ui-tests.sh
          ./Scripts/run-ui-tests.sh
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neoanki2-fast-ui-results
          path: .build/ui-results
          if-no-files-found: warn
          retention-days: 7
