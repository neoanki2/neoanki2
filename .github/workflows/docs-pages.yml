name: Documentation

on:
  pull_request:
    paths:
      - docs/**
      - Sources/NeoAnki2/**
      - NeoAnkiCore/Sources/NeoAnkiCore/**
      - NeoAnkiCore/Sources/NeoAnkiDeckCLI/**
      - Tests/NeoAnki2Tests/**
      - UITests/NeoAnki2UITests/**
      - Scripts/validate-docs.swift
      - Scripts/validate-built-docs.py
      - .github/workflows/docs-pages.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - Scripts/validate-docs.swift
      - Scripts/validate-built-docs.py
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate documentation
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate feature coverage and links
        run: swift Scripts/validate-docs.swift --require-screenshots
      - name: Check changed features have documentation updates
        if: github.event_name == 'pull_request'
        run: swift Scripts/validate-docs.swift --require-screenshots --base-ref "origin/${{ github.base_ref }}"

  build:
    name: Build documentation site
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Add build metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          data_directory = Path("docs/_data")
          data_directory.mkdir(exist_ok=True)
          metadata = {
              "commit_sha": os.environ["COMMIT_SHA"],
              "published_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(timespec="seconds").replace("+00:00", "Z"),
          }
          (data_directory / "build.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./docs
          destination: ./_site
      - name: Validate rendered documentation
        run: >-
          python3 Scripts/validate-built-docs.py _site
          --base-url https://neoanki2.github.io/neoanki2
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
