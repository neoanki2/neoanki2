name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-content:
    name: Documentation content validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate feature coverage and links
        run: swift Scripts/validate-docs.swift
      - name: Check changed features have documentation updates
        if: github.event_name == 'pull_request'
        run: swift Scripts/validate-docs.swift --require-screenshots --allow-headless-screenshot-deferral --base-ref "origin/${{ github.base_ref }}"
      - name: Check direct main changes have documentation updates
        if: github.event_name == 'push'
        run: swift Scripts/validate-docs.swift --require-screenshots --allow-headless-screenshot-deferral --base-ref "${{ github.event.before }}"

  validate-api:
    name: API reference and contract
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check generated API reference
        run: swift run neoanki-api-reference check
      - name: Test endpoint registry and OpenAPI contract
        run: swift test --filter NeoAnkiAPITests --parallel

  validate:
    name: Documentation and screenshot gate
    if: always()
    needs: [validate-content, validate-api]
    runs-on: ubuntu-latest
    steps:
      - name: Require documentation content and API validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            exit 0
          fi
          echo "Documentation content or API validation did not succeed." >&2
          exit 1

  build:
    name: Build documentation site
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Add build metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          data_directory = Path("docs/_data")
          data_directory.mkdir(exist_ok=True)
          metadata = {
              "commit_sha": os.environ["COMMIT_SHA"],
              "published_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(timespec="seconds").replace("+00:00", "Z"),
          }
          (data_directory / "build.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./docs
          destination: ./_site
      - name: Validate rendered documentation
        run: >-
          python3 Scripts/validate-built-docs.py _site
          --base-url https://neoanki2.github.io
      - name: Install headless documentation browser
        run: |
          npm install --prefix .build/docs-playwright --no-save playwright@1.62.1
          .build/docs-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate responsive and keyboard behavior
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.build/docs-playwright/node_modules/playwright/index.mjs
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/neoanki-docs-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node Scripts/check-docs-responsive.mjs http://127.0.0.1:4173
      - name: Build legacy project-site redirects
        run: >-
          python3 Scripts/build-docs-redirect.py _site _redirect_site
          --canonical-base https://neoanki2.github.io
          --legacy-prefix /neoanki2
      - name: Validate legacy project-site redirects
        run: >-
          python3 Scripts/validate-docs-redirect.py _site _redirect_site
          --canonical-base https://neoanki2.github.io
      - name: Upload compatibility redirect artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _redirect_site

  deploy:
    name: Deploy legacy redirect
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  publish-canonical:
    name: Publish and verify canonical documentation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dispatch canonical-site deployment
        env:
          GH_TOKEN: ${{ secrets.ROOT_DOCS_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || {
            echo "ROOT_DOCS_DISPATCH_TOKEN must dispatch neoanki2/neoanki2.github.io workflows" >&2
            exit 1
          }
          gh workflow run root-docs.yml \
            --repo neoanki2/neoanki2.github.io \
            --ref main
      - name: Wait for the exact source revision and smoke-test API pages
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 Scripts/check-published-docs.py --expected-sha "$EXPECTED_SHA"
