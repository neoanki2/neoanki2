name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base revision for strict pull-request documentation validation
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Documentation content validation
    runs-on: macos-26-intel
    timeout-minutes: 10
    outputs:
      site_changed: ${{ steps.site.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate documentation and required updates
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || inputs.base_ref }}
        run: |
          arguments=(--require-screenshots)
          if [[ -n "$BASE_REF" ]]; then
            arguments+=(--base-ref "$BASE_REF")
          fi
          swift Scripts/validate-docs.swift "${arguments[@]}"
      - name: Check whether the rendered site needs rebuilding
        id: site
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          changed=true
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            changed=$(python3 Scripts/test-docs-build.py --changed "$PREVIOUS_SHA")
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    name: Build documentation site
    needs: validate-content
    if: needs.validate-content.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Build and verify the rendered site and legacy redirects
        env:
          INPUT_TOKEN: ${{ github.token }}
        run: python3 Scripts/test-docs-build.py --redirect-site _redirect_site
      - name: Upload compatibility redirect artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _redirect_site

  deploy:
    name: Deploy legacy redirect
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  publish-canonical:
    name: Publish and verify canonical documentation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Dispatch canonical-site deployment
        env:
          GH_TOKEN: ${{ secrets.ROOT_DOCS_DISPATCH_TOKEN }}
          DOCUMENTATION_SOURCE_SHA: ${{ github.sha }}
          DOCUMENTATION_RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$GH_TOKEN" || {
            echo "ROOT_DOCS_DISPATCH_TOKEN must dispatch neoanki2/neoanki2.github.io workflows" >&2
            exit 1
          }
          gh workflow run root-docs.yml \
            --repo neoanki2/neoanki2.github.io \
            --ref main \
            -f source_sha="$DOCUMENTATION_SOURCE_SHA" \
            -f documentation_run_id="$DOCUMENTATION_RUN_ID"
      - name: Wait for the exact source revision and smoke-test API pages
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 Scripts/check-published-docs.py --expected-sha "$EXPECTED_SHA"
