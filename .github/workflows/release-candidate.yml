name: Release candidate
run-name: Release candidate for PR #${{ inputs.pr }} at ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to validate and package
        required: true
        type: string
      head:
        description: Exact pull-request head revision
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  id-token: write
  attestations: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  package:
    name: Build and attest candidate
    runs-on: macos-26
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
      - name: Build release candidate
        run: |
          chmod +x Scripts/install-app.sh Scripts/build-release-artifact.sh \
            Scripts/build-release-candidate.sh
          bash -n Scripts/release.sh Scripts/build-release-candidate.sh \
            Scripts/publish-release-candidate.sh Scripts/ship-release.sh
          ./Scripts/build-release-candidate.sh --pr "${{ inputs.pr }}"
      - name: Read candidate tag
        id: manifest
        run: echo "tag=$(jq -r .tag .build/release-candidate/release-candidate.json)" >> "$GITHUB_OUTPUT"
      - name: Attest candidate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .build/release-candidate/*.dmg
      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neoanki2-release-candidate-${{ steps.manifest.outputs.tag }}
          path: .build/release-candidate/
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Publish tested draft release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.head }}
      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: neoanki2-release-candidate-${{ needs.package.outputs.tag }}
          path: .build/release-candidate
      - name: Publish draft release
        run: |
          chmod +x Scripts/publish-release-candidate.sh
          ./Scripts/publish-release-candidate.sh .build/release-candidate
