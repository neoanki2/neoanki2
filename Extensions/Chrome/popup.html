<!doctype html>
<!-- Operate: a quiet, single-column capture form; selected text leads, Save anchors the footer.
     Inherits NeoAnki2's system typography, semantic surfaces, and one primary accent. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add to NeoAnki2</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup">
  <header><h1>Add to NeoAnki2</h1><button id="settings" class="quiet" type="button">Settings</button></header>
  <p id="status" role="status" aria-live="polite">Connecting…</p>
  <form id="card-form">
    <fieldset id="fields" disabled>
      <label for="front">Front</label>
      <textarea id="front" rows="2" maxlength="10000" placeholder="Select text on a page, or type here" required></textarea>
      <div class="answer-label"><label for="back">Back</label><span id="dictionary-name" class="muted"></span></div>
      <textarea id="back" rows="6" maxlength="30000" placeholder="Meaning, translation, or answer" required></textarea>
      <p id="lookup-status" class="hint" role="status" aria-live="polite"></p>
      <div id="suggestions" aria-label="Dictionary suggestions"></div>
      <label for="deck">Deck</label>
      <select id="deck"><option value="">Unassigned</option></select>
      <p id="source" class="hint source"></p>
    </fieldset>
    <footer><button id="discard" class="quiet" type="button">Use selection</button><button id="save" type="submit" disabled>Save card</button></footer>
  </form>
</body>
</html>
